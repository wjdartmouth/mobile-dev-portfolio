name: FocusTimer
options:
  bundleIdPrefix: com.jianwang.portfolio
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FocusTimer:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared
    resources:
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSUserNotificationsUsageDescription: Focus Timer sends alerts when a focus or break session ends.
        NSSupportsLiveActivities: true
    entitlements:
      path: Resources/FocusTimer.entitlements
    dependencies:
      - target: FocusTimerWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jianwang.portfolio.focustimer
        INFOPLIST_KEY_CFBundleDisplayName: Focus Timer
        CODE_SIGN_ENTITLEMENTS: Resources/FocusTimer.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  FocusTimerWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    resources:
      - path: Resources/Assets.xcassets
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Focus Timer Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
    entitlements:
      path: Resources/FocusTimerWidgets.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jianwang.portfolio.focustimer.widgets
        CODE_SIGN_ENTITLEMENTS: Resources/FocusTimerWidgets.entitlements
schemes:
  FocusTimer:
    build:
      targets:
        FocusTimer: all
        FocusTimerWidgets: all
    run:
      config: Debug
