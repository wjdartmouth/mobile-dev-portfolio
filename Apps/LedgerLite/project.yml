name: LedgerLite
options:
  bundleIdPrefix: com.jianwang.portfolio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LedgerLite:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportsDocumentBrowser: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jianwang.portfolio.ledgerlite
        INFOPLIST_KEY_CFBundleDisplayName: Ledger Lite
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LedgerLiteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Sources/Domain
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jianwang.portfolio.ledgerlite.tests
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
schemes:
  LedgerLite:
    build:
      targets:
        LedgerLite: [run, profile, analyze, archive]
        LedgerLiteTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: LedgerLiteTests
