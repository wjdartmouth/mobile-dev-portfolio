name: PulseWeather
options:
  bundleIdPrefix: com.jianwang.portfolio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PulseWeather:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
      properties:
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: Pulse Weather uses your location to show local forecasts.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jianwang.portfolio.pulseweather
        INFOPLIST_KEY_CFBundleDisplayName: Pulse Weather
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PulseWeatherTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - Fixtures/**
      - path: Sources/Models/WeatherModels.swift
      - path: Sources/Utilities/WeatherCode.swift
      - path: Sources/Services/OpenMeteoDecoding.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jianwang.portfolio.pulseweather.tests
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
schemes:
  PulseWeather:
    build:
      targets:
        PulseWeather: [run, profile, analyze, archive]
        PulseWeatherTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: PulseWeatherTests
