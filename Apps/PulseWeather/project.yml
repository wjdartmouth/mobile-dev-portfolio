name: PulseWeather
options:
  bundleIdPrefix: com.jianwang.portfolio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PulseWeather:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
      properties:
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: Pulse Weather uses your location to show local forecasts.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jianwang.portfolio.pulseweather
        INFOPLIST_KEY_CFBundleDisplayName: Pulse Weather
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  PulseWeather:
    build:
      targets:
        PulseWeather: all
