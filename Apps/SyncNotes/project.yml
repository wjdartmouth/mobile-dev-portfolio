name: SyncNotes
options:
  bundleIdPrefix: com.jianwang.portfolio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SyncNotes:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
      properties:
        UILaunchScreen: {}
    entitlements:
      path: Resources/SyncNotes.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jianwang.portfolio.syncnotes
        INFOPLIST_KEY_CFBundleDisplayName: Sync Notes
        CODE_SIGN_ENTITLEMENTS: Resources/SyncNotes.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  SyncNotes:
    build:
      targets:
        SyncNotes: all
